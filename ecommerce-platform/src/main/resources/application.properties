# ---- Server ----
server.port=8080

# ---- H2 file-based database ----
# Data is saved to ./data/ecommerce.mv.db so it persists between restarts.
spring.datasource.url=jdbc:h2:file:./data/ecommerce;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Lets you browse the DB in a web UI at /h2-console (dev only!)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
# "update" means Hibernate creates/updates tables automatically from your @Entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- App info ----
spring.application.name=ecommerce-platform
