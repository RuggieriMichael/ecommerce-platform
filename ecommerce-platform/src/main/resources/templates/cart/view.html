<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Your Cart — ShopSphere</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h2 class="section-title">Your Cart</h2>

    <div th:if="${#lists.isEmpty(cartItems)}" class="empty-state">
        <p>Your cart is empty.</p>
        <a href="/products" class="btn">Browse Products</a>
    </div>

    <div th:unless="${#lists.isEmpty(cartItems)}" style="display:flex; gap:30px; flex-wrap:wrap;">
        <div style="flex:2; min-width:320px;">
            <div class="cart-row" th:each="item : ${cartItems}">
                <img th:src="${item.product.imageUrl}" alt="item"/>
                <div class="info">
                    <div th:text="${item.product.name}">Name</div>
                    <div class="muted" th:text="'$' + ${item.product.price} + ' each'">$0.00 each</div>
                </div>
                <form th:action="@{'/cart/update/' + ${item.id}}" method="post" style="display:flex; gap:6px; align-items:center;">
                    <input type="number" name="quantity" th:value="${item.quantity}" min="1"/>
                    <button type="submit" class="btn btn-outline btn-small">Update</button>
                </form>
                <div class="price" th:text="'$' + ${item.subtotal}">$0.00</div>
                <form th:action="@{'/cart/remove/' + ${item.id}}" method="post">
                    <button type="submit" class="btn btn-danger btn-small">Remove</button>
                </form>
            </div>
        </div>

        <div style="flex:1; min-width:260px;">
            <div class="summary-box">
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span th:text="'$' + ${total}">$0.00</span>
                </div>
                <a href="/checkout" class="btn" style="width:100%; text-align:center; margin-top:14px; display:block;">Checkout</a>
            </div>
        </div>
    </div>
</div>

<footer>Built with Spring Boot &amp; Thymeleaf — portfolio demo, no real payments processed.</footer>
</body>
</html>
