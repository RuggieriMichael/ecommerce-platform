<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Admin — Product Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h2 class="section-title" th:text="${product.id} != null ? 'Edit Product' : 'New Product'">Product Form</h2>

    <form th:action="@{/admin/products/save}" method="post" class="form-box" style="max-width:600px; margin:0;">
        <input type="hidden" name="id" th:value="${product.id}"/>

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" th:value="${product.name}" required/>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4" th:text="${product.description}"></textarea>
        </div>
        <div class="form-group">
            <label>Price (USD)</label>
            <input type="number" step="0.01" min="0" name="price" th:value="${product.price}" required/>
        </div>
        <div class="form-group">
            <label>Image URL</label>
            <input type="text" name="imageUrl" th:value="${product.imageUrl}"/>
        </div>
        <div class="form-group">
            <label>Stock Quantity</label>
            <input type="number" min="0" name="stockQuantity" th:value="${product.stockQuantity}" required/>
        </div>
        <div class="form-group">
            <label>Category</label>
            <select name="categoryId" required>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:selected="${product.category != null and product.category.id == cat.id}"
                        th:text="${cat.name}">Category</option>
            </select>
        </div>

        <button type="submit" class="btn" style="width:100%;">Save Product</button>
    </form>
</div>

<footer>Built with Spring Boot &amp; Thymeleaf — portfolio demo, no real payments processed.</footer>
</body>
</html>
