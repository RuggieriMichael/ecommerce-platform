<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Shop — ShopSphere</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h2 class="section-title" th:text="${keyword} != null ? 'Results for &quot;' + ${keyword} + '&quot;' : 'All Products'">All Products</h2>

    <div class="filters">
        <a th:href="@{/products}" th:classappend="${selectedCategoryId} == null ? 'active' : ''">All</a>
        <a th:each="cat : ${categories}"
           th:href="@{/products(categoryId=${cat.id})}"
           th:classappend="${selectedCategoryId} == ${cat.id} ? 'active' : ''"
           th:text="${cat.name}">Category</a>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="empty-state">
        <p>No products found.</p>
    </div>

    <div class="grid">
        <div class="card" th:each="product : ${products}">
            <a th:href="@{'/products/' + ${product.id}}">
                <img th:src="${product.imageUrl}" alt="product image"/>
            </a>
            <div class="card-body">
                <h3><a th:href="@{'/products/' + ${product.id}}" th:text="${product.name}">Name</a></h3>
                <div class="price" th:text="'$' + ${product.price}">$0.00</div>
                <div class="muted" th:text="${product.stockQuantity} > 0 ? ${product.stockQuantity} + ' in stock' : 'Out of stock'">Stock</div>
            </div>
        </div>
    </div>
</div>

<footer>Built with Spring Boot &amp; Thymeleaf — portfolio demo, no real payments processed.</footer>
</body>
</html>
