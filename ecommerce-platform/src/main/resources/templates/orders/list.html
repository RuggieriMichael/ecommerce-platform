<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>My Orders — ShopSphere</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h2 class="section-title">My Orders</h2>

    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
        <p>You haven't placed any orders yet.</p>
        <a href="/products" class="btn">Browse Products</a>
    </div>

    <table th:unless="${#lists.isEmpty(orders)}">
        <thead>
        <tr><th>Order #</th><th>Date</th><th>Status</th><th>Total</th><th></th></tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="'#' + ${order.id}">#1</td>
            <td th:text="${#temporals.format(order.orderDate, 'MMM d, yyyy h:mm a')}">Date</td>
            <td><span class="badge" th:classappend="'badge-' + ${order.status}" th:text="${order.status}">Status</span></td>
            <td th:text="'$' + ${order.totalAmount}">$0.00</td>
            <td><a th:href="@{'/orders/' + ${order.id}}">View</a></td>
        </tr>
        </tbody>
    </table>
</div>

<footer>Built with Spring Boot &amp; Thymeleaf — portfolio demo, no real payments processed.</footer>
</body>
</html>
