<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>ShopSphere — Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="hero">
    <h1>Everything you need, one storefront.</h1>
    <p>A full-stack demo e-commerce platform — browse, cart, and check out.</p>
    <a href="/products" class="btn">Shop Now</a>
</section>

<div class="container">
    <h2 class="section-title">Featured Products</h2>
    <div class="grid">
        <div class="card" th:each="product : ${featuredProducts}">
            <a th:href="@{'/products/' + ${product.id}}">
                <img th:src="${product.imageUrl}" alt="product image"/>
            </a>
            <div class="card-body">
                <h3><a th:href="@{'/products/' + ${product.id}}" th:text="${product.name}">Name</a></h3>
                <div class="price" th:text="'$' + ${product.price}">$0.00</div>
            </div>
        </div>
    </div>
</div>

<footer>Built with Spring Boot &amp; Thymeleaf — portfolio demo, no real payments processed.</footer>
</body>
</html>
